[project]
name = "temporal-saes"
version = "0.1.0"
description = ""
authors = [{ name = "Alex Oesterling" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch",
    "torchaudio",
    "torchvision",
    "nnsight>=0.3.0,<0.4.0",
    "dictionary-learning",
    "scikit-learn>=1.7.1,<2",
    "numpy>=1.26,<2",
    "spacy>=3.8.7,<4",
    "datasets<4.0.0",
    "tqdm>=4.67.1,<5",
    "en-core-web-sm",
    "python-dotenv>=1.1.1,<2",
    "matplotlib>=3.10.7,<4",
    "seaborn>=0.13.2,<0.14",
    "plotly>=6.3.1,<7",
    "transformers>=4.57.1,<5",
]

[tool.uv]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "torch" }
torchaudio = { index = "torch" }
torchvision = { index = "torch" }
dictionary-learning = { path = "dictionary_learning", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv.build-backend]
module-name = ["src"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
