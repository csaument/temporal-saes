[project]
name = "dictionary-learning"
version = "0.1.0"
description = "Dictionary learning via sparse autoencoders on neural network activations"
authors = [
    { name = "Samuel Marks" },
    { name = "Adam Karvonen" },
    { name = "Aaron Mueller" },
]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "deep-learning",
    "sparse-autoencoders",
    "mechanistic-interpretability",
    "PyTorch",
]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "circuitsvis>=1.43.2",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "nnsight>=0.3.0,<0.9",
    "pandas>=2.2.1",
    "plotly>=5.18.0",
    "tqdm>=4.66.1",
    "zstandard>=0.22.0",
    "wandb>=0.12.0",
    "umap-learn>=0.5.6",
    "llvmlite>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/saprmarks/dictionary_learning"
Repository = "https://github.com/saprmarks/dictionary_learning"

[dependency-groups]
dev = ["pytest>=8.3.4,<9"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["dictionary_learning"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_variables = ["dictionary_learning/__init__.py:__version__"]
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "main"
build_command = "pip install poetry && poetry build"
